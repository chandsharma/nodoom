name: Compatibility or bug report
description: Report a false block, missed Reel screen, crash or setup problem.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private messages, usernames, captions, raw accessibility dumps, login details or an Instagram APK.
  - type: input
    id: nodoom
    attributes:
      label: No Doom version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android build
      placeholder: Pixel 9 Pro, Android 16, build ...
    validations:
      required: true
  - type: input
    id: instagram
    attributes:
      label: Official Instagram version
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Where did it happen?
      options:
        - Home feed
        - Reel viewer
        - Reels tab
        - Direct messages
        - Stories
        - Explore
        - Profile or search
        - Comments or share sheet
        - No Doom setup or timer
        - Android Settings or uninstall
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Use public/test content and remove personal details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behaviour
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed account details and private screen content.
          required: true

