plugins {
    id 'com.android.application'
}

def signingPropertiesFile = rootProject.file('signing.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}
def releaseStoreFile = signingProperties.getProperty('storeFile')
        ?: System.getenv('NODOOM_STORE_FILE')
def releaseStorePassword = signingProperties.getProperty('storePassword')
        ?: System.getenv('NODOOM_STORE_PASSWORD')
def releaseKeyAlias = signingProperties.getProperty('keyAlias')
        ?: System.getenv('NODOOM_KEY_ALIAS')
def releaseKeyPassword = signingProperties.getProperty('keyPassword')
        ?: System.getenv('NODOOM_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile
        && releaseStorePassword
        && releaseKeyAlias
        && releaseKeyPassword

android {
    namespace 'com.chandsharma.nodoom'
    compileSdk 36

    defaultConfig {
        applicationId 'com.chandsharma.nodoom'
        minSdk 34
        targetSdk 36
        versionCode 7
        versionName '1.0.0'

        testInstrumentationRunner 'android.app.Instrumentation'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

